name: Deploy Collector

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_COLLECTOR_SERVICE: ${{ vars.ECS_COLLECTOR_SERVICE }}
  ECS_COLLECTOR_TASK_DEFINITION: ${{ vars.ECS_COLLECTOR_TASK_DEFINITION }}
  COLLECTOR_HEALTH_URL: ${{ vars.COLLECTOR_HEALTH_URL }}
  CORE_API_URL: ${{ vars.CORE_API_URL }}
  SMOKE_PROJECT_ID: ${{ vars.SMOKE_PROJECT_ID }}

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,agent]"
      - name: Ruff
        run: python -m ruff check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,agent]"
      - name: Pytest
        run: python -m pytest tests -q

  compileall:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,agent]"
      - name: Compile
        run: python -m compileall opsincident_collector

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, tests, compileall]
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build --build-arg INSTALL_TARGET=".[mcp,agent]" -t incidentops-collector:ci .

  deploy:
    name: Push ECR and Deploy ECS
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_REGION != '' && vars.ECR_REPOSITORY != '' && vars.ECS_CLUSTER != '' && vars.ECS_COLLECTOR_SERVICE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg INSTALL_TARGET=".[mcp,agent]" -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
      - name: Deploy ECS service
        run: |
          if [ -n "${ECS_COLLECTOR_TASK_DEFINITION:-}" ]; then
            TASK_DEF_ARN="$(aws ecs describe-task-definition --task-definition "$ECS_COLLECTOR_TASK_DEFINITION" --query 'taskDefinition.taskDefinitionArn' --output text)"
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_COLLECTOR_SERVICE" --task-definition "$TASK_DEF_ARN" --force-new-deployment
          else
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_COLLECTOR_SERVICE" --force-new-deployment
          fi
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_COLLECTOR_SERVICE"
      - name: Health check
        if: ${{ env.COLLECTOR_HEALTH_URL != '' }}
        run: |
          curl -fsS "$COLLECTOR_HEALTH_URL"
      - name: Optional local RAG pipeline smoke
        if: ${{ env.CORE_API_URL != '' && env.SMOKE_PROJECT_ID != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,agent]"
          opsincident-collector validate-rag-pipeline \
            --path tests/fixtures/basic_project \
            --api-url "$CORE_API_URL" \
            --project-id "$SMOKE_PROJECT_ID" \
            --format json
