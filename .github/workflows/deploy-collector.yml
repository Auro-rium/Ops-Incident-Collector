name: Validate and Deploy Azure Collector

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-azure-deploy
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  CORE_REPOSITORY: ${{ vars.CORE_REPOSITORY || 'Auro-rium/Ops-Incident-Core' }}
  CORE_DEPLOY_REF: ${{ vars.CORE_DEPLOY_REF || 'core' }}
  CORE_DEPLOY_WORKFLOW: ${{ vars.CORE_DEPLOY_WORKFLOW || 'deploy-azure.yml' }}

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,agent]"
      - name: Ruff
        run: python -m ruff check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,agent]"
      - name: Pytest
        run: python -m pytest tests -q

  compileall:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,agent]"
      - name: Compile
        run: python -m compileall opsincident_collector

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
      - compileall
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build --build-arg INSTALL_TARGET=".[mcp,agent]" -t incidentops-collector:${{ github.sha }} .

  deploy:
    name: Dispatch Core Azure deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Trigger Core Azure deployment
        env:
          CORE_DEPLOY_TOKEN: ${{ secrets.CORE_DEPLOY_TOKEN }}
        run: |
          if [ -z "${CORE_DEPLOY_TOKEN}" ]; then
            echo "::warning::CORE_DEPLOY_TOKEN secret is not configured; validation passed but Core Azure deploy dispatch was skipped."
            echo "Create a fine-grained GitHub token with Actions write access to ${CORE_REPOSITORY} to enable automatic collector redeploys."
            exit 0
          fi

          python - <<'PY' > /tmp/core-dispatch.json
          import json
          import os

          payload = {
              "ref": os.environ["CORE_DEPLOY_REF"],
              "inputs": {
                  "image_tag": f"collector-{os.environ['GITHUB_SHA']}",
                  "deploy_collector": "false",
              },
          }
          print(json.dumps(payload))
          PY

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CORE_DEPLOY_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CORE_REPOSITORY}/actions/workflows/${CORE_DEPLOY_WORKFLOW}/dispatches" \
            --data @/tmp/core-dispatch.json

          echo "Dispatched ${CORE_REPOSITORY}/${CORE_DEPLOY_WORKFLOW} on ${CORE_DEPLOY_REF} for collector ${GITHUB_SHA}."
