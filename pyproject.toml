[project]
name = "opsincident-collector"
version = "0.1.0"
description = "Self-hosted collector, MCP server, and local orchestration runtime for IncidentOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
watch = ["watchdog>=4,<7"]
mcp = ["mcp>=1.9,<2"]
agent = [
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
]
all = [
    "mcp>=1.9,<2",
    "watchdog>=4,<7",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
]
dev = [
    "pytest>=8,<9",
    "respx>=0.21,<1",
]

[project.scripts]
opsincident-collector = "opsincident_collector.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsincident_collector*"]

[tool.setuptools.package-data]
opsincident_collector = ["prompts/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
